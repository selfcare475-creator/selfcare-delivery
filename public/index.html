<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SC Delivery">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Self Care Delivery</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07101d;--card:#111a2b;--line:#2f4261;--mint:#20c7b6;--blue:#2f80ff;--yellow:#f59e0b;--red:#ef4444;--text:#eef6ff;--muted:#9aa8bd;--shadow:0 18px 40px rgba(0,0,0,.32)}
body{margin:0;background:linear-gradient(180deg,#07101d,#0b1220 40%,#07101d);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:90px}
.top{position:sticky;top:0;z-index:20;background:rgba(7,16,29,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(47,66,97,.7);padding:10px 12px 10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.logo{display:flex;align-items:center;gap:9px}
.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#14b8a6,#34d399);display:grid;place-items:center;color:#07101d;font-weight:1000;font-size:19px}
.title{font-size:18px;font-weight:1000;letter-spacing:-.5px}
.sync{font-size:11px;color:var(--muted);font-weight:800;margin-top:1px}
.refresh{height:40px;border:1px solid #344865;border-radius:14px;background:#10192a;color:#eef6ff;font-weight:1000;padding:0 12px;font-size:13px}
.notif-btn{border-color:#f59e0b;color:#fbbf24;background:#1c1608;animation:pulseNotifBtn 2s ease-in-out infinite}
@keyframes pulseNotifBtn{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:7px}
.tab{height:40px;border-radius:14px;background:#10192a;color:#cbd5e1;border:1px solid #263752;font-weight:1000;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);padding:0 6px;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,#15a99c,#23d3c4);border-color:#2dd4bf;color:#07101d}
.tab.add-tab{color:#5eead4;border-color:#14b8a6;background:#0d1b2d}
.filters{display:grid;grid-template-columns:1fr;gap:7px;margin-bottom:7px}
.manual-courier{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:9px}
.manual-courier .add-driver{height:46px;border-radius:17px;border:0;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#07101d;font-size:13px;font-weight:1000;padding:0 14px;white-space:nowrap}
.select,.search{width:100%;height:40px;border-radius:14px;border:1px solid #2f4261;background:#10192a;color:#eef6ff;font-weight:950;font-size:14px;padding:0 12px;outline:none}
.search{text-align:right}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:5px}
.sum{background:#0e1728;border:1px solid #263752;border-radius:12px;padding:5px 3px;text-align:center;color:#eef6ff;cursor:pointer;min-height:40px}
.sum.active{border-color:#2dd4bf;background:#102845}
.sum b{display:block;font-size:15px;color:#2dd4bf;line-height:1.05;font-weight:1000}
.sum span{font-size:9px;color:#9aa8bd;font-weight:1000;line-height:1.05}
.sum.pri{border-color:#f59e0b;background:#1c1608}
.sum.pri b{color:#fbbf24}
.sum.pri.active{border-color:#f59e0b;background:#2a1f0a;box-shadow:0 0 0 2px rgba(245,158,11,.28)}
.sum.danger{border-color:#7f1d1d;background:#1a0a0e}
.sum.danger b{color:#fca5a5}
.sum.danger.active{border-color:#ef4444;background:#2a0f13;box-shadow:0 0 0 2px rgba(239,68,68,.3)}
.wrap{padding:10px}
.list{display:grid;gap:10px}
.card{background:linear-gradient(180deg,#111c30,#0d1626);border:1px solid #3b5478;border-radius:20px;box-shadow:var(--shadow)}
.card.delivered{opacity:.55}
@keyframes blinkDot{50%{opacity:.25}}
.countdown{margin-bottom:8px;border-radius:15px;padding:10px 12px;font-size:15px;font-weight:1000;text-align:center;display:flex;align-items:center;justify-content:center;gap:9px;letter-spacing:-.3px}
.countdown.soon{background:linear-gradient(135deg,#f97316,#fb923c);color:#1a0a02;border:1px solid #fed7aa;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.countdown.late{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border:1px solid #fecaca;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.countdown-dot{width:10px;height:10px;border-radius:50%;background:currentColor;animation:blinkDot 1s ease-in-out infinite;flex:0 0 auto}
.card-inner{padding:9px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:7px}
.code{border:1px solid #2dd4bf;border-radius:999px;padding:6px 10px;font-size:16px;font-weight:1000;color:#e0f2fe}
.badge{border-radius:999px;padding:5px 8px;font-size:11px;font-weight:1000;white-space:nowrap}
.b-waiting{background:#2a1f10;color:#fbbf24;border:1px solid #f59e0b}
.b-assigned{background:#102845;color:#93c5fd;border:1px solid #3b82f6}
.b-arrived{background:#112f2d;color:#5eead4;border:1px solid #14b8a6}
.b-delivered{background:#142018;color:#86efac;border:1px solid #22c55e}
.b-soon{background:#2a1708;color:#fed7aa;border:1px solid #f97316}
.b-late{background:#2a1010;color:#fecaca;border:1px solid #ef4444}
.main{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:9px}
.hotel{border:1px solid #31527a;background:#0e1728;border-radius:15px;min-height:34px;padding:7px 10px;font-size:13px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;display:flex;align-items:center;justify-content:center}
.info{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.chip{border:1px solid #263752;background:#08111f;border-radius:13px;min-height:30px;padding:6px 8px;font-size:11px;font-weight:950;color:#dbeafe;text-align:center}
.chip.exit{color:#5eead4;border-color:#14b8a6}
.chip.pay{color:#fbbf24;border-color:#f59e0b}
.person-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.person{display:inline-flex;align-items:center;border-radius:999px;border:1px solid #31527a;background:#0e1728;color:#cbd5e1;padding:5px 7px;font-size:10px;font-weight:1000}
.person.prep{border-color:#14b8a6;color:#5eead4}
.person.courier{border-color:#3b82f6;color:#93c5fd}
.assign-box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.courier-select,.courier-picker{height:38px;border-radius:14px;background:#0b1220;border:1px solid #2f4261;color:#eef6ff;font-size:12px;font-weight:950;padding:0 9px;outline:none;width:100%;text-align:right}.courier-picker{display:flex;align-items:center;justify-content:space-between;cursor:pointer}.courier-picker span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.courier-picker:before{content:"⌄";color:#9aa8bd;font-size:18px;line-height:1}.courier-picker.has-value{border-color:#3b82f6;color:#dbeafe}
.assign-btn{height:38px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#3b82f6);border:0;color:#eef6ff;font-size:12px;font-weight:1000;padding:0 10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.action{height:37px;border-radius:14px;border:0;color:#fff;font-size:12px;font-weight:1000;box-shadow:0 8px 16px rgba(0,0,0,.22)}
.loc{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.clear{background:linear-gradient(135deg,#475569,#64748b)}
.done{background:linear-gradient(135deg,#16a34a,#22c55e);color:#07101d}
.problem{background:linear-gradient(135deg,#dc2626,#ef4444)}
.empty{margin:24px auto;text-align:center;color:#9aa8bd;background:#10192a;border:1px solid #263752;border-radius:22px;padding:24px 12px;font-weight:950}
.toast{position:fixed;right:14px;left:14px;bottom:14px;z-index:60;background:#07101d;border:1px solid #2f4261;color:#fff;text-align:center;padding:13px;border-radius:16px;font-weight:1000;box-shadow:var(--shadow);opacity:0;transform:translateY(16px);pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:translateY(0)}
.loading .refresh{opacity:.6}
@media(max-width:430px){
  .summary{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sum{min-height:38px;padding:5px 2px}
  .sum b{font-size:14px}
  .sum span{font-size:9.5px}
  .top{padding:12px 10px 10px}
  .wrap{padding:9px 8px}
  .title{font-size:20px}
  .main{grid-template-columns:1fr}
  .amount{width:max-content;max-width:100%}
  .assign-box{grid-template-columns:1fr}
  .assign-btn{width:100%}
}

.simple-info{grid-template-columns:1fr 1fr}
.simple-info:has(.chip.wide){grid-template-columns:1fr}
.simple-info .chip.wide{grid-column:1/-1;min-height:38px;font-size:14px;font-weight:1000;padding:8px 12px}
.simple-actions{grid-template-columns:1fr 1fr}
.simple-actions:has(button:only-child){grid-template-columns:1fr}.simple-actions .wide{grid-column:1/-1}
.person-row:empty{display:none}
.actions:empty{display:none}
@media(max-width:430px){
  .simple-info{grid-template-columns:1fr 1fr}
  .simple-actions{grid-template-columns:1fr 1fr}
}


.hotel-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.map-mini{height:34px;border-radius:14px;border:1px solid #14b8a6;background:#0d2d2b;color:#5eead4;font-size:11px;font-weight:1000;padding:0 10px;white-space:nowrap}
@media(max-width:430px){
  /* keep hotel + location on same row on mobile too */
}

.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:flex-end;padding:12px}
.modal.show{display:flex}
.modal-panel{width:100%;max-height:82vh;background:linear-gradient(180deg,#10192a,#07101d);border:1px solid #2f4261;border-radius:24px;box-shadow:var(--shadow);padding:13px;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.modal-title{font-size:18px;font-weight:1000;color:#eef6ff}
.modal-close{width:38px;height:38px;border-radius:14px;border:1px solid #2f4261;background:#0b1220;color:#cbd5e1;font-size:24px;line-height:1}
.modal-search{width:100%;height:43px;border-radius:16px;border:1px solid #3b82f6;background:#0b1220;color:#eef6ff;font-weight:950;font-size:14px;padding:0 12px;text-align:right;outline:none;margin-bottom:10px}
.courier-list{display:grid;gap:6px;max-height:52vh;overflow:auto;padding-left:3px}
.courier-option{height:42px;border-radius:15px;border:1px solid #263752;background:#0e1728;color:#eef6ff;font-size:14px;font-weight:950;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right}
.courier-option .dot{width:18px;height:18px;border-radius:50%;border:2px solid #64748b;flex:0 0 auto}
.courier-option.selected{border-color:#3b82f6;background:#102845}
.courier-option.selected .dot{border-color:#2dd4bf;box-shadow:inset 0 0 0 4px #102845;background:#2dd4bf}
.courier-empty{border:1px solid #263752;background:#0e1728;color:#9aa8bd;border-radius:16px;padding:18px;text-align:center;font-weight:950}
.add-courier-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:12px}
.add-courier-btn{height:43px;border-radius:16px;border:0;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#07101d;font-size:14px;font-weight:1000;padding:0 16px;white-space:nowrap}
.manage-option{height:46px;border-radius:15px;border:1px solid #263752;background:#0e1728;color:#eef6ff;font-size:14px;font-weight:950;padding:0 8px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.manage-option span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del-courier{width:34px;height:34px;flex:0 0 auto;border-radius:11px;border:1px solid #ef4444;background:#241014;color:#fecaca;font-size:18px;font-weight:1000;line-height:1;display:grid;place-items:center}
.modal.show .confirm-panel{align-self:center;margin:auto}
.confirm-panel{max-width:380px}
.confirm-text{font-size:16px;font-weight:1000;color:#eef6ff;text-align:center;padding:8px 4px 16px;line-height:1.5}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm-no{height:46px;border-radius:16px;border:1px solid #344865;background:#10192a;color:#cbd5e1;font-size:14px;font-weight:1000}
.confirm-yes{height:46px;border-radius:16px;border:0;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-size:14px;font-weight:1000}

/* ============================================================
   PREMIUM VISUAL OVERHAUL v4
   ============================================================ */

/* ---- Splash Screen ---- */
.splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(155deg,#0d9488 0%,#14b8a6 45%,#22d3ee 100%);display:grid;place-items:center;transition:opacity .55s ease,visibility .55s ease}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center;color:#fff;padding:20px}
.splash-logo{width:148px;height:148px;margin:0 auto 26px;border-radius:38px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35),0 0 0 8px rgba(255,255,255,.08);animation:splashPop .7s cubic-bezier(.34,1.56,.64,1)}
.splash-logo img{width:100%;height:100%;display:block}
.splash-title{font-size:30px;font-weight:1000;letter-spacing:-.7px;margin-bottom:10px;text-shadow:0 2px 12px rgba(0,0,0,.25);animation:splashFadeUp .55s .2s both}
.splash-sub{font-size:14px;font-weight:900;opacity:.9;margin-bottom:28px;letter-spacing:.5px;animation:splashFadeUp .55s .35s both}
.splash-dots{display:flex;gap:10px;justify-content:center;animation:splashFadeUp .55s .5s both}
.splash-dots span{width:11px;height:11px;border-radius:50%;background:#fff;animation:splashDot 1.2s infinite ease-in-out}
.splash-dots span:nth-child(2){animation-delay:.15s}
.splash-dots span:nth-child(3){animation-delay:.3s}
@keyframes splashPop{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes splashFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashDot{0%,80%,100%{opacity:.35;transform:scale(1)}40%{opacity:1;transform:scale(1.4)}}

/* ---- Premium Header ---- */
.top{padding:12px 14px 12px;background:linear-gradient(180deg,rgba(7,16,29,.98) 0%,rgba(7,16,29,.94) 100%);border-bottom:1px solid rgba(20,184,166,.15)}
.head{margin-bottom:11px}
.logo{gap:11px}
.mark{width:48px;height:48px;border-radius:14px;padding:0;overflow:hidden;background:transparent;box-shadow:0 6px 20px rgba(20,184,166,.35);position:relative}
.mark img{width:100%;height:100%;display:block}
.mark:after{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(140deg,rgba(255,255,255,.18),transparent 50%);pointer-events:none}
.title{font-size:18px;font-weight:1000;letter-spacing:-.3px;background:linear-gradient(90deg,#eef6ff,#5eead4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.sync{font-size:11px;color:#7dd3c0;font-weight:800;margin-top:2px;display:flex;align-items:center;gap:5px}
.sync:before{content:"";width:6px;height:6px;border-radius:50%;background:#22d3ee;box-shadow:0 0 8px #22d3ee;animation:syncPulse 2s ease-in-out infinite}
@keyframes syncPulse{50%{opacity:.4}}

/* ---- Tabs & Filters (refined) ---- */
.tabs{gap:8px}
.tab{height:42px;border-radius:14px;font-size:14px;letter-spacing:-.2px}
.tab.active{box-shadow:0 6px 16px rgba(20,184,166,.35)}
.tab span{margin-inline-start:6px;font-size:13px;opacity:.95}
.search{height:42px;border-radius:14px;font-size:14px}
.search::placeholder{color:#64748b}
.summary{gap:6px;margin-top:6px}
.sum{border-radius:13px;min-height:46px;padding:6px 3px;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:transform .1s}
.sum:active{transform:scale(.96)}
.sum b{font-size:17px;font-weight:1000}
.sum span{font-size:9.5px}

/* ---- Cards - Premium redesign ---- */
.wrap{padding:12px 10px}
.list{gap:12px}
.card{border-radius:22px;background:linear-gradient(180deg,#131e34 0%,#0d1626 100%);border:1px solid #3b5478;box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 0 1px rgba(148,163,184,.06),inset 0 1px 0 rgba(255,255,255,.05)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-inner{padding:8px}

/* card head - order id + status badge */
.card-head{margin-bottom:6px;align-items:center}
.code{font-size:13px;font-weight:1000;padding:4px 10px;border-radius:999px;color:#5eead4;background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.35);letter-spacing:-.2px;display:inline-flex;align-items:center;gap:6px}
.dup-badge{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid rgba(245,158,11,.45);border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:1000;line-height:1}
.badge{font-size:11px;padding:5px 9px;border-radius:999px;font-weight:1000;letter-spacing:-.2px}

/* v27d: essentials source (from cigarettes-prices site) */
.essentials-tag{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:1px solid #fb923c;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:1000;line-height:1;letter-spacing:.4px;text-transform:uppercase;box-shadow:0 2px 8px rgba(249,115,22,.35);display:inline-flex;align-items:center;gap:4px}
.card.essentials{background:linear-gradient(180deg,#2a1810 0%,#1f1108 100%);border-color:#c2410c}
.card.essentials::before{background:linear-gradient(180deg,#f97316,#ea580c) !important;content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:4px;border-radius:20px 0 0 20px}
.card.essentials .code{color:#fed7aa;background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.4)}
.card.essentials .hotel{background:linear-gradient(135deg,#2a1a10 0%,#1f120a 100%);border-color:#7c3416;color:#fed7aa}
.card.essentials .time-block{background:linear-gradient(135deg,#1f1208 0%,#2a1810 100%);border-color:#7c3416}
.card.essentials .time-block .time-value{color:#fed7aa}
.card.essentials .time-block.primary{background:linear-gradient(135deg,#2a1810 0%,#3a220f 100%);border-color:#f97316}
.card.essentials .time-block.primary .time-value{color:#ffedd5;text-shadow:0 2px 12px rgba(249,115,22,.4)}
.card.essentials .time-block.primary .time-label{color:#fed7aa}

/* Times row: pickup (primary) + delivery (secondary) side by side */
.times-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.time-block{background:linear-gradient(135deg,#0a1b2a 0%,#0e2438 100%);border:1px solid #1e3a5f;border-radius:11px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-height:52px}
.time-block .time-label{font-size:11px;font-weight:1000;color:#64748b;line-height:1;letter-spacing:.3px}
.time-block .time-value{font-size:16px;font-weight:1000;color:#93c5fd;line-height:1;letter-spacing:-.3px}
.time-block.primary{background:linear-gradient(135deg,#0d2d2b 0%,#0a2523 100%);border-color:#14b8a6}
.time-block.primary .time-label{color:#5eead4}
.time-block.primary .time-value{font-size:20px;color:#eef6ff;text-shadow:0 2px 12px rgba(20,184,166,.35)}
.card.soon .time-block.primary{border-color:#f97316;background:linear-gradient(135deg,#1f160f 0%,#150e08 100%)}
.card.soon .time-block.primary .time-value{color:#fed7aa}
.card.soon .time-block.primary .time-label{color:#fed7aa}
.card.late .time-block.primary{border-color:#ef4444;background:linear-gradient(135deg,#241014 0%,#180a0d 100%)}
.card.late .time-block.primary .time-value{color:#fecaca}
.card.late .time-block.primary .time-label{color:#fecaca}

/* Hotel row - compact */
.hotel-row{gap:6px;margin-bottom:6px;margin-top:6px;grid-template-columns:minmax(0,1fr) auto}
.hotel{min-height:32px;padding:5px 12px;font-size:13px;font-weight:1000;border-radius:10px;background:linear-gradient(135deg,#0e1b2f 0%,#0a1728 100%);border:1px solid #2f4261;color:#eef6ff;letter-spacing:-.2px}
.map-mini{height:32px;border-radius:10px;font-size:11px;font-weight:1000;padding:0 11px;background:linear-gradient(135deg,#0d2d2b 0%,#0a2523 100%)}

/* Action button - compact */
.actions{margin-top:6px}
.action{height:38px;border-radius:10px;font-size:13px;font-weight:1000;letter-spacing:-.2px;box-shadow:0 4px 10px rgba(34,197,94,.22);transition:transform .12s}
.action:active{transform:scale(.97)}
.action.done{background:linear-gradient(135deg,#16a34a 0%,#22c55e 100%);color:#052e15}

/* Countdown banner - compact */
.countdown{padding:5px 12px;font-size:12.5px;border-radius:10px;margin-bottom:6px;letter-spacing:-.2px;min-height:30px}
.countdown-dot{width:8px;height:8px}

/* Urgency signaled via LEFT accent strip only - keeps card body neutral */
.card{position:relative}
.card.soon:before,.card.late:before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:4px;border-radius:20px 0 0 20px}
.card.soon:before{background:linear-gradient(180deg,#f97316,#ea580c)}
.card.late:before{background:linear-gradient(180deg,#ef4444,#dc2626)}
/* status badge tint stays subtle */
.card.soon .code{color:#fed7aa;background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.25)}
.card.late .code{color:#fecaca;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.25)}

/* List gap - clear card separation with divider */
.list{gap:20px;position:relative}
.list > .card + .card{position:relative}
.list > .card + .card::after{content:"";position:absolute;top:-11px;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(94,234,212,.4) 50%,transparent 100%);pointer-events:none}
.wrap{padding:12px 10px}

/* Empty state - nicer */
.empty{background:linear-gradient(180deg,#10192a 0%,#0b1220 100%);border:1px dashed #263752;border-radius:22px;padding:40px 20px;font-size:15px;color:#64748b}

/* Refresh button - refined */
.refresh{border-radius:14px;height:42px;font-size:13px;background:linear-gradient(135deg,#10192a 0%,#0b1220 100%);border-color:#2f4261;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.refresh:active{transform:scale(.96)}

/* Toast - refined */
.toast{border-radius:18px;padding:14px 18px;background:linear-gradient(135deg,#111c30 0%,#0a1220 100%);border-color:#2f4261;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateY(0)}

/* Body background subtle pattern */
body{background:radial-gradient(ellipse at top,#0a1a2e 0%,#07101d 40%,#050b16 100%)}

/* ---- Gear settings button ---- */
.gear-btn{width:42px;padding:0!important;font-size:16px}

/* ---- Couriers Management Modal ---- */
.couriers-list{max-height:45vh;overflow-y:auto;margin-bottom:10px}
.courier-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:linear-gradient(135deg,#0e1b2f 0%,#0a1728 100%);border:1px solid #2f4261;border-radius:12px;margin-bottom:6px}
.courier-item-name{font-size:14px;font-weight:1000;color:#eef6ff}
.courier-delete{background:transparent;border:1px solid #7f1d1d;border-radius:10px;color:#fca5a5;font-size:12px;font-weight:1000;padding:5px 10px;line-height:1}
.courier-delete:active{background:rgba(239,68,68,.15)}
.couriers-empty{padding:20px 10px;text-align:center;color:#64748b;font-size:13px;font-weight:800}
.couriers-add{display:grid;gap:6px;padding-top:8px;border-top:1px solid #2f4261}
.courier-input{width:100%;height:44px;border-radius:14px;border:1px solid #2f4261;background:#10192a;color:#eef6ff;font-weight:1000;font-size:14px;padding:0 12px;text-align:right;outline:none}
.courier-input:focus{border-color:#14b8a6}

/* ---- Courier Picker Modal ---- */
.picker-list{max-height:60vh;overflow-y:auto;display:grid;gap:6px}
.picker-btn{width:100%;min-height:52px;border-radius:14px;border:1px solid #14b8a6;background:linear-gradient(135deg,#0d2d2b 0%,#0a2523 100%);color:#5eead4;font-weight:1000;font-size:15px;padding:10px 14px;text-align:right;letter-spacing:-.2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.picker-btn:active{transform:scale(.97);background:linear-gradient(135deg,#0f3d3a 0%,#0c322f 100%)}
.picker-empty{padding:20px 10px;text-align:center;color:#94a3b8;font-size:13px;font-weight:900;line-height:1.5}

/* ---- Courier Badge on Card ---- */
.courier-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(59,130,246,.08));border:1px solid rgba(59,130,246,.4);color:#93c5fd;border-radius:10px;padding:4px 10px;font-size:12px;font-weight:1000;margin-top:2px;letter-spacing:-.2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* v25: Clickable courier pill — replaces static badge. Tap it to open picker. */
.courier-pill{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(135deg,rgba(59,130,246,.14),rgba(59,130,246,.06));border:1px solid rgba(59,130,246,.35);color:#bfdbfe;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:1000;margin-top:6px;letter-spacing:-.2px;width:100%;box-sizing:border-box;cursor:pointer;font-family:inherit;transition:.15s;box-shadow:0 1px 0 rgba(59,130,246,.08) inset}
.courier-pill:hover{background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(59,130,246,.1));border-color:rgba(59,130,246,.55)}
.courier-pill:active{transform:scale(.99)}
.courier-pill.empty{background:linear-gradient(135deg,rgba(148,163,184,.1),rgba(148,163,184,.04));border-color:rgba(148,163,184,.3);color:#cbd5e1;font-weight:800;justify-content:center}
.courier-pill.empty:hover{background:linear-gradient(135deg,rgba(148,163,184,.15),rgba(148,163,184,.08));border-color:rgba(148,163,184,.5)}
.courier-pill .pill-hint{font-size:10px;font-weight:800;color:rgba(191,219,254,.65);background:rgba(255,255,255,.08);padding:2px 8px;border-radius:6px;letter-spacing:0;flex-shrink:0}

/* v27: Pharmacy prep status — small pill inline next to the status badge */
.badges-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.prep-badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:1000;letter-spacing:-.1px;border-width:1px;border-style:solid;line-height:1;white-space:nowrap}
.prep-badge.ready{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.5);color:#6ee7b7}
.prep-badge.not-started{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.45);color:#fca5a5}

/* v26: Late-order alarm banner — full-width, pulsing, above everything */
.alarm-banner{position:fixed;top:0;left:0;right:0;z-index:99999;background:linear-gradient(135deg,#991b1b,#dc2626,#ef4444);color:#fff;padding:0;display:none;box-shadow:0 6px 24px rgba(220,38,38,.5);border-bottom:3px solid #fef2f2;animation:alarmPulseBg 1.2s ease-in-out infinite}
.alarm-banner.show{display:block}
.alarm-banner.muted{animation:none;opacity:.9}
.alarm-inner{display:flex;align-items:center;gap:12px;padding:12px 14px;max-width:900px;margin:0 auto}
.alarm-icon{font-size:26px;flex-shrink:0;animation:alarmShake .6s ease-in-out infinite}
.alarm-banner.muted .alarm-icon{animation:none}
.alarm-text{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.alarm-text b{font-size:14px;font-weight:1000;letter-spacing:-.2px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.alarm-text span{font-size:11.5px;opacity:.95;font-weight:700}
.alarm-count{font-size:16px;background:rgba(255,255,255,.2);padding:1px 8px;border-radius:6px;margin:0 3px}
.alarm-mute{background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.25);padding:8px 12px;border-radius:10px;font-weight:1000;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.alarm-mute:hover{background:rgba(0,0,0,.5)}
@keyframes alarmPulseBg{0%,100%{background:linear-gradient(135deg,#991b1b,#dc2626,#ef4444)}50%{background:linear-gradient(135deg,#dc2626,#ef4444,#f87171)}}
@keyframes alarmShake{0%,100%{transform:rotate(0deg) scale(1)}25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
/* Push the top of the page down when alarm is active so it doesn't cover content */
body.alarm-active{padding-top:64px}
@media(max-width:430px){body.alarm-active{padding-top:76px}.alarm-text b{font-size:13px}.alarm-text span{font-size:11px}}
/* Alarm-highlighted cards: extra red pulse */
.card.alarm-late{border-color:#ef4444!important;box-shadow:0 0 0 2px rgba(239,68,68,.4),0 8px 24px rgba(239,68,68,.35)!important;animation:cardAlarmPulse 1.5s ease-in-out infinite}
@keyframes cardAlarmPulse{0%,100%{box-shadow:0 0 0 2px rgba(239,68,68,.4),0 8px 24px rgba(239,68,68,.35)}50%{box-shadow:0 0 0 3px rgba(239,68,68,.7),0 8px 32px rgba(239,68,68,.55)}}

.warn-icon{font-size:16px;flex:0 0 auto;line-height:1}

function init(){
  loadOrders();
  loadCouriers();
  setInterval(loadOrders,10000);
  setInterval(loadCouriers,60000);
  setInterval(()=>{if(!document.hidden&&orders.length)try{render()}catch(e){}},30000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadOrders();loadCouriers()}});
  window.addEventListener("focus",loadOrders);
  // v26: Late-order alarm loop
  setInterval(checkLateAlarm,30000);
  setInterval(()=>{if(alarmActive&&!alarmMuted)playAlarmSiren()},60000);
  // Prime the audio context on the first user gesture (autoplay policy compliance)
  const priming=()=>{try{ensureAudioCtx();if(alarmAudioCtx&&alarmAudioCtx.state==="suspended")alarmAudioCtx.resume().catch(()=>{})}catch(e){}
    document.removeEventListener("click",priming);document.removeEventListener("touchstart",priming);};
  document.addEventListener("click",priming,{once:false});
  document.addEventListener("touchstart",priming,{once:false});
}
async function loadOrders(){
  try{
    if(document.body&&document.body.classList)document.body.classList.add("loading");
    const urls=[
      SB_URL+"/rest/v1/orders?select=*&order=created_at.desc&limit=700",
      SB_URL+"/rest/v1/orders?select=*&limit=700"
    ];
    let d=null,lastError="";
    for(const url of urls){
      try{
        const r=await fetch(url,{headers:SB_HEADERS});
        const txt=await r.text();
        let body=[];
        try{body=txt?JSON.parse(txt):[]}catch(parseErr){body=[]}
        if(r.ok){d=body;break}
        lastError=body&&body.message?body.message:(txt||"load failed");
      }catch(err){lastError=err&&err.message?err.message:String(err)}
    }
    if(!Array.isArray(d))throw new Error(lastError||"load failed");
    orders=dedupeOrders(d.filter(o=>!isCancelled(o)&&!isDraftOrder(o)&&within48Hours(o)));
    const last=document.getElementById("lastSync");
    if(last)last.textContent="آخر تحديث: "+arNum(new Date().toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"}));
    try{render()}catch(viewErr){console.error("render failed",viewErr);toast("تم تحميل البيانات لكن حصل خطأ في العرض")}
    try{checkReminders()}catch(e){}
  }catch(e){
    console.error("delivery manager load failed",e);
    const last=document.getElementById("lastSync");
    if(last)last.textContent="فشل التحديث";
    const list=document.getElementById("ordersList");
    if(list)list.innerHTML="";
    const empty=document.getElementById("ordersEmpty");
    if(empty){empty.style.display="block";empty.textContent="تعذر تحميل الطلبات. اضغط تحديث."}
    toast("حصل خطأ في تحميل الطلبات");
  }finally{
    if(document.body&&document.body.classList)document.body.classList.remove("loading");
  }
}

// hash-based smart render: skip if nothing changed structurally
let lastStructHash="";
function structHashOf(current){
  return current.map(o=>`${o.id}|${(o._ids||[]).length}|${dispatcherStatus(o)}|${deadlineClass(o)}|${o.delivery_time}|${o.hotel}|${o.courier_name||""}|${o.postponed_from||""}|${o.pharmacy_status||""}`).join("~")
    + `|${activeStatus}|${activeDay}|${searchValue}`;
}

function updateHeaderCounts(base){
  document.getElementById("todayCount").textContent=arNum(orders.filter(o=>effectiveDay(o)==="today").length);
  document.getElementById("tomorrowCount").textContent=arNum(orders.filter(o=>effectiveDay(o)==="tomorrow").length);
  document.getElementById("sumNeed").textContent=arNum(base.filter(o=>dispatcherStatus(o)==="need_assign").length);
  document.getElementById("sumLate").textContent=arNum(base.filter(o=>dispatcherStatus(o)==="late").length);
  // تم الاستلام يشمل: assigned + arrived + delivered — كل اللي اتنقّل من محتاج استلام
  document.getElementById("sumAssigned").textContent=arNum(base.filter(o=>{
    const s=dispatcherStatus(o);
    return s==="assigned"||s==="arrived"||s==="delivered";
  }).length);
  document.getElementById("dayToday").classList.toggle("active",activeDay==="today");
  document.getElementById("dayTomorrow").classList.toggle("active",activeDay==="tomorrow");
  document.getElementById("sumBtnNeed").classList.toggle("active",activeStatus==="need_assign");
  document.getElementById("sumBtnLate").classList.toggle("active",activeStatus==="late");
  document.getElementById("sumBtnAssigned").classList.toggle("active",activeStatus==="assigned");
}

function updateCountdownsInPlace(current){
  for(const o of current){
    const el=document.querySelector('[data-order-id="'+String(o.id).replace(/"/g,'')+'"]');
    if(!el)continue;
    const newHtml=countdownHtml(o);
    const existing=el.querySelector(':scope > .card-inner > .countdown');
    if(newHtml){
      const tmp=document.createElement("div");tmp.innerHTML=newHtml;
      const newEl=tmp.firstElementChild;
      if(!newEl)continue;
      if(existing){
        // update text only if different
        if(existing.outerHTML!==newEl.outerHTML){
          // update text content without re-creating node, preserves animations
          const newText=newEl.childNodes[newEl.childNodes.length-1];
          if(newText && newText.nodeType===3){
            const oldText=existing.childNodes[existing.childNodes.length-1];
            if(oldText && oldText.nodeType===3){
              if(oldText.textContent!==newText.textContent) oldText.textContent=newText.textContent;
            }
          }
          // update class if type changed (soon<->late)
          if(existing.className!==newEl.className){existing.className=newEl.className}
        }
      }else{
        const head=el.querySelector(':scope > .card-inner > .card-head');
        if(head)head.after(newEl);
      }
    }else if(existing){
      existing.remove();
    }
  }
}

function render(){
  const base=orders.filter(dayPass);
  updateHeaderCounts(base);
  const current=base.filter(statusPass).filter(searchPass).sort(sortOrders);
  const list=document.getElementById("ordersList");
  const empty=document.getElementById("ordersEmpty");
  if(!current.length){
    if(list.children.length){list.innerHTML=""}
    empty.style.display="block";empty.textContent="مفيش طلبات هنا";
    lastStructHash="__empty__";
    return;
  }
  empty.style.display="none";
  const h=structHashOf(current);
  if(h===lastStructHash){
    // نفس الترتيب والحالات — نحدّث بس العد التنازلي في مكانه من غير blink
    updateCountdownsInPlace(current);
    return;
  }
  lastStructHash=h;
  list.innerHTML=current.map(card).join("");
}
function card(o){
  const st=statusInfo(o);
  const id=String(o.id);
  const arr=ar12(o.delivery_time)||"غير محدد";
  const pickupDt=orderPickupDateTime(o);
  const pickup=pickupDt?ar12(`${String(pickupDt.getHours()).padStart(2,"0")}:${String(pickupDt.getMinutes()).padStart(2,"0")}`):"";
  const hotel=hotelArName(o.hotel);
  const cd=countdownHtml(o);
  const warn=hotelWarningHtml(o);
  const dsp=dispatcherStatus(o);
  const showAction=(dsp==="need_assign"||dsp==="late");
  const postponedBadge=o.postponed_from
    ? `<div class="postpone-badge">⏱ مؤجل من ${esc(ar12(o.postponed_from)||o.postponed_from)} لـ ${esc(arr)}</div>`
    : "";
  // v25: For orders that already have a courier, the badge itself is clickable
  // to reassign. For need_assign/late orders, the green "استلام" button already
  // handles courier picking, so we don't add a redundant pill there.
  let actionHtml="";
  if(showAction){
    actionHtml=`<div class="actions simple-actions">
         <button class="action done wide" onclick="markReceived('${esc(idsText(o))}')" type="button">✓ تم استلام الطلب</button>
       </div>`;
    if(o.courier_name){
      // Rare case: order still in need_assign/late but courier was set elsewhere — allow change
      actionHtml+=`<button class="courier-pill assigned" onclick="changeCourier('${esc(idsText(o))}')" type="button" title="اضغط لتغيير الطيار">🏍 مع ${esc(o.courier_name)}<span class="pill-hint">تغيير</span></button>`;
    }
  } else if(o.courier_name){
    actionHtml=`<button class="courier-pill assigned" onclick="changeCourier('${esc(idsText(o))}')" type="button" title="اضغط لتغيير الطيار">🏍 مع ${esc(o.courier_name)}<span class="pill-hint">تغيير</span></button>`;
  } else {
    // No courier + not in need_assign state (e.g., delivered without record) — offer picker
    actionHtml=`<button class="courier-pill empty" onclick="changeCourier('${esc(idsText(o))}')" type="button">🏍 اختار طيار</button>`;
  }
  return `<article class="card ${st.key} ${deadlineClass(o)} ${o.source==='essentials'?'essentials':''}" data-order-id="${esc(id)}">
    <div class="card-inner">
      <div class="card-head">
        <div class="code">#${esc(arNum(o.id))}${o._ids&&o._ids.length>1?`<span class="dup-badge">+${arNum(o._ids.length-1)} مكرر</span>`:""}</div>
        <div class="badges-group">
          ${o.source==='essentials'?`<div class="essentials-tag">🚬 ESSENTIALS</div>`:""}
          <div class="badge ${st.cls}">${esc(st.text)}</div>
          ${pharmacyReadinessBadge(o)}
        </div>
      </div>
      ${postponedBadge}
      ${warn}
      ${cd}
      <div class="times-row">
        <div class="time-block primary">
          <div class="time-label">استلام مقترح</div>
          <div class="time-value">${esc(pickup||"—")}</div>
        </div>
        <div class="time-block">
          <div class="time-label">وصول</div>
          <div class="time-value">${esc(arr)}</div>
        </div>
      </div>
      <div class="hotel-row">
        <div class="hotel">${esc(hotel)}</div>
        <button class="map-mini" onclick="openHotelLocation('${esc(id)}')">لوكيشن</button>
      </div>
      ${actionHtml}
    </div>
  </article>`;
}

function hasHotelIssue(o){
  const raw=String(o.hotel||"").trim();
  if(!raw)return true;
  const digitsOnly=raw.replace(/[\s\-()+\.,]/g,"");
  if(/^\+?\d{7,}$/.test(digitsOnly))return true;
  const letters=raw.replace(/[^a-zA-Z\u0600-\u06FF]/g,"");
  return letters.length<3;
}

function hotelWarningHtml(o){
  const st=dispatcherStatus(o);
  if(st==="delivered"||st==="arrived")return"";
  if(!hasHotelIssue(o))return"";
  return `<div class="warn-banner"><span class="warn-icon">⚠️</span>اتصل بالصيدلية قبل التوصيل</div>`;
}
function countdownHtml(o){
  const st=dispatcherStatus(o);
  if(st==="assigned"||st==="arrived"||st==="delivered")return"";
  const dt=orderPickupDateTime(o);
  if(!dt)return"";
  const diff=dt.getTime()-Date.now();
  const mins=Math.max(1,Math.round(Math.abs(diff)/60000));
  const label=formatMinutesAr(mins);
  if(diff<0){
    return `<div class="countdown late"><span class="countdown-dot"></span>عدّى معاد الاستلام بـ ${label}</div>`;
  }
  if(isSoon(o)){
    return `<div class="countdown soon"><span class="countdown-dot"></span>باقي ${label} على الاستلام</div>`;
  }
  return"";
}
function formatMinutesAr(m){
  if(m<60)return arNum(m)+" دقيقة";
  const h=Math.floor(m/60);
  const min=m%60;
  if(!min)return arNum(h)+" ساعة";
  return arNum(h)+" س و "+arNum(min)+" د";
}

let couriers=[];
let pickerResolve=null;

async function loadCouriers(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/couriers?active=eq.true&order=name.asc&select=id,name,phone",{headers:SB_HEADERS});
    if(!r.ok)throw new Error(await r.text());

  document.getElementById("couriersModal").classList.remove("show");

function renderCouriersList(){
  const list=document.getElementById("couriersList");
  if(!list)return;
  if(!couriers.length){
    list.innerHTML='<div class="couriers-empty">مفيش طيارين مسجّلين. ضيف من تحت.</div>';
    return;
  }
  list.innerHTML=couriers.map(c=>
    `<div class="courier-item">
      <div class="courier-item-name">${esc(c.name)}</div>
      <button class="courier-delete" onclick="deleteCourier(${c.id},'${esc(c.name).replace(/'/g,"\\'")}')">حذف</button>
    </div>`
  ).join("");

async function addCourier(){
  const inp=document.getElementById("courierNameInput");
  const name=String(inp.value||"").trim();
  if(!name){toast("اكتب اسم الطيار الأول");return}
  if(name.length>50){toast("الاسم طويل جداً");return}
  if(couriers.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast("الطيار ده مضاف قبل كده");return}
  try{
    const r=await fetch(SB_URL+"/rest/v1/couriers",{
      method:"POST",
      headers:{...SB_HEADERS,"Prefer":"return=representation"},
      body:JSON.stringify({name,active:true})
    });
    if(!r.ok)throw new Error(await r.text());
    const data=await r.json();
    if(Array.isArray(data)&&data[0])couriers.push({id:data[0].id,name:data[0].name});
    couriers.sort((a,b)=>a.name.localeCompare(b.name,"ar"));
    inp.value="";
    renderCouriersList();
    toast("تم إضافة "+name+" ✓");
  }catch(e){console.error(e);toast("تعذر الإضافة")}
}

async function deleteCourier(id,name){
  if(!await askConfirm("حذف الطيار "+name+"؟","حذف"))return;
  try{
    const r=await fetch(SB_URL+"/rest/v1/couriers?id=eq."+id,{
      method:"PATCH",
      headers:SB_HEADERS,
      body:JSON.stringify({active:false})
    });
    if(!r.ok)throw new Error(await r.text());
    couriers=couriers.filter(c=>c.id!==id);
    renderCouriersList();
    toast("تم حذف "+name);
  }catch(e){console.error(e);toast("تعذر الحذف")}
}

// اختيار طيار عند استلام أوردر
function pickCourier(){
  return new Promise(resolve=>{
    pickerResolve=resolve;
    const list=document.getElementById("pickerList");
    if(!list)return resolve(null);
    if(!couriers.length){
      list.innerHTML='<div class="picker-empty">مفيش طيارين مسجّلين.<br>افتح ⚙️ من فوق وضيف طيار الأول.</div>';
    }else{
      list.innerHTML=couriers.map(c=>
        `<button class="picker-btn" onclick="selectCourier('${esc(c.name).replace(/'/g,"\\'")}')">${esc(c.name)}</button>`
      ).join("");
    }
    document.getElementById("pickerModal").classList.add("show");
  });
}
function selectCourier(name){
  document.getElementById("pickerModal").classList.remove("show");
  if(pickerResolve){pickerResolve(name);pickerResolve=null}
}
function cancelPicker(){
  document.getElementById("pickerModal").classList.remove("show");
  if(pickerResolve){pickerResolve(null);pickerResolve=null}
}

async function markReceived(ids){
  const courierName=await pickCourier();
  if(!courierName)return;
  const payload={delivery_status:"assigned",courier_assigned_at:new Date().toISOString(),courier_name:courierName};
  await patchOrders(ids,payload,"الأوردر مع "+courierName);
}
// v25: Change/reassign courier without touching delivery_status — usable at any time
async function changeCourier(ids){
  const courierName=await pickCourier();
  if(!courierName)return;
  const payload={courier_name:courierName,courier_assigned_at:new Date().toISOString()};
  await patchOrders(ids,payload,"الطيار اتغير لـ "+courierName);
}
async function patchOrders(ids,payload,msg){
  try{
    const list=String(ids||"").split(",").map(x=>x.trim()).filter(Boolean);
    await Promise.all(list.map(id=>fetch(SB_URL+"/rest/v1/orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:SB_HEADERS,body:JSON.stringify(payload)}).then(async r=>{if(!r.ok)throw new Error(await r.text())})));
    orders.forEach(o=>{if((o._ids||[String(o.id)]).some(id=>list.includes(String(id))))Object.assign(o,payload)});
    render();
    toast(msg);
  }catch(e){console.error(e);toast("تعذر الحفظ")}
}
function within48Hours(o){
  const ref=o.created_at?new Date(o.created_at):effectiveDate(o);
  if(!(ref instanceof Date)||isNaN(ref))return true;
  return Date.now()-ref.getTime()<=48*60*60*1000;
}
function dispatcherStatus(o){
  const s=deliveryStatus(o);
  if(s==="delivered")return"delivered";
  if(s==="arrived")return"arrived";
  if(s==="assigned")return"assigned";
  if(isLateUnassigned(o))return"late";
  return"need_assign";
}
function deliveryStatus(o){
  const s=String(o.delivery_status||"").toLowerCase();
  if(s==="done"||s==="delivered")return"delivered";
  if(s==="arrived"||s==="courier_arrived")return"arrived";
  if(s==="accepted"||s==="assigned"||s==="picked_up")return"assigned";
  return"waiting";
}
function statusInfo(o){
  const s=dispatcherStatus(o);
  if(s==="delivered")return{key:"delivered",cls:"b-delivered",text:"تم التسليم"};

/* ============================================================
   v26: Late-order alarm system
   - Fires when an order is 40+ minutes past pickup deadline with
     no courier assigned. Shows a red banner + plays a loud siren
     sound + vibrates the phone. Re-alerts every minute until
     dismissed or the order is assigned.
   ============================================================ */
const ALARM_THRESHOLD_MIN=40;
const alarmedOrderIds=new Set();
let alarmActive=false;
let alarmMuted=false;
let alarmAudioCtx=null;

function ensureAudioCtx(){
  if(alarmAudioCtx)return alarmAudioCtx;
  try{alarmAudioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){alarmAudioCtx=null}
  return alarmAudioCtx;
}

function playAlarmSiren(){
  const ctx=ensureAudioCtx();
  if(!ctx)return;
  if(ctx.state==="suspended")ctx.resume().catch(()=>{});
  const now=ctx.currentTime;
  // Loud two-tone siren (three cycles)
  for(let i=0;i<3;i++){
    const start=now+i*0.55;
    // Rising tone
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="square";
    osc.frequency.setValueAtTime(760,start);
    osc.frequency.linearRampToValueAtTime(1240,start+0.28);
    osc.frequency.linearRampToValueAtTime(760,start+0.5);
    gain.gain.setValueAtTime(0,start);
    gain.gain.linearRampToValueAtTime(0.7,start+0.05);
    gain.gain.linearRampToValueAtTime(0.7,start+0.45);
    gain.gain.linearRampToValueAtTime(0,start+0.5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start+0.5);
    // Second oscillator for richness
    const osc2=ctx.createOscillator();
    const gain2=ctx.createGain();
    osc2.type="sawtooth";
    osc2.frequency.setValueAtTime(380,start);
    osc2.frequency.linearRampToValueAtTime(620,start+0.28);
    osc2.frequency.linearRampToValueAtTime(380,start+0.5);
    gain2.gain.setValueAtTime(0,start);
    gain2.gain.linearRampToValueAtTime(0.4,start+0.05);
    gain2.gain.linearRampToValueAtTime(0.4,start+0.45);
    gain2.gain.linearRampToValueAtTime(0,start+0.5);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.start(start);
    osc2.stop(start+0.5);
  }
  // Vibrate on mobile
  if(navigator.vibrate){
    try{navigator.vibrate([400,120,400,120,400,120,600])}catch(e){}
  }
}

function checkLateAlarm(){
  const now=Date.now();
  const currentAlarmed=new Set();
  for(const o of orders){
    if(o.courier_name)continue;
    const dt=orderPickupDateTime(o);
    if(!dt)continue;
    const minutesLate=(now-dt.getTime())/60000;
    if(minutesLate>=ALARM_THRESHOLD_MIN){
      const ids=(o._ids&&o._ids.length?o._ids:[o.id]).map(String);
      ids.forEach(id=>currentAlarmed.add(id));
    }
  }
  // Find newly-alarmed orders
  const newlyAlarmed=[...currentAlarmed].filter(id=>!alarmedOrderIds.has(id));
  const anyAlarmed=currentAlarmed.size>0;
  // Update state
  alarmedOrderIds.clear();
  currentAlarmed.forEach(id=>alarmedOrderIds.add(id));
  // Update banner
  const banner=document.getElementById("alarmBanner");
  const countEl=document.getElementById("alarmCount");
  if(banner){
    if(anyAlarmed){
      // Count unique groups (dedupe by _ids) — approximate by group count
      const groupCount=orders.filter(o=>{
        const ids=(o._ids&&o._ids.length?o._ids:[o.id]).map(String);
        return ids.some(id=>alarmedOrderIds.has(id));
      }).length;
      if(countEl)countEl.textContent=arNum(groupCount);
      banner.classList.add("show");
      document.body.classList.add("alarm-active");
      alarmActive=true;
    } else {
      banner.classList.remove("show","muted");
      document.body.classList.remove("alarm-active");
      alarmActive=false;
      alarmMuted=false;
    }
  }
  // Highlight cards
  document.querySelectorAll("article.card").forEach(card=>{
    const id=card.getAttribute("data-order-id");
    if(id&&alarmedOrderIds.has(id))card.classList.add("alarm-late");
    else card.classList.remove("alarm-late");
  });
  // Fire siren if a new order just entered alarm state (and not muted)
  if(newlyAlarmed.length>0&&!alarmMuted){
    playAlarmSiren();
  }
}

function orderExitMinutes(o){const mins=timeMinutes(o.delivery_time);if(mins===9999)return 9999;let v=mins-60;if(v<0)v+=1440;return v}

function timeMinutes(t){
  const s=String(t||"").trim();

  let m=s.match(/(\d{1,2}):(\d{2})\s*(AM|PM|ص|م|صباحًا|صباحا|مساءً|مساء)?/i);
  if(m){
    let h=parseInt(m[1],10);
    const min=parseInt(m[2],10);
    const tag=String(m[3]||"").toLowerCase();
    if(/pm|م|مساء/.test(tag)&&h<12)h+=12;
    if(/am|ص|صباح/.test(tag)&&h===12)h=0;
    return h*60+min;
  }

  m=s.match(/(?:\b(AM|PM)\s*)?(\d{1,2})(?:\s*(AM|PM|ص|م|صباحًا|صباحا|مساءً|مساء))?/i);
  if(!m)return 9999;
  let h=parseInt(m[2],10);
  const tag=String(m[1]||m[3]||"").toLowerCase();
  if(/pm|م|مساء/.test(tag)&&h<12)h+=12;
  if(/am|ص|صباح/.test(tag)&&h===12)h=0;
  return h*60;
}
function effectiveDate(o){const direct=parseOrderDate(o.delivery_date||o.order_date||o.date||o.delivery_day);if(direct)return direct;const base=o.created_at?new Date(o.created_at):new Date();const d=new Date(base.getFullYear(),base.getMonth(),base.getDate());if(isTomorrowWord(o.delivery_day))d.setDate(d.getDate()+1);return d}
function effectiveDay(o){const e=effectiveDate(o);const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);if(sameDay(e,today))return"today";if(sameDay(e,tomorrow))return"tomorrow";return"other"}

function parseOrderDate(v){const s=String(v||"").trim();if(!s)return null;if(isTomorrowWord(s)||/today|اليوم|النهاردة|dnes/i.test(s))return null;let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m){const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d)?null:d}m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);return isNaN(d)?null:d}return null}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function formatDateAr(d){if(!(d instanceof Date)||isNaN(d))return"غير محدد";const days=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];return days[d.getDay()]+" "+arNum(d.getDate())+"/"+arNum(d.getMonth()+1)}

// ====== نظام تذكير قبل معاد الأوردر بساعة ======
const REMINDER_LEAD_MIN=60;      // نبعت التذكير قبل معاد الوصول بساعة
const REMINDER_TOLERANCE_MIN=20; // شباك زمني نطلق فيه (٤٠-٦٠ دقيقة قبل)
const REMINDER_STORAGE_KEY="sc_reminded_orders_v1";

function getRemindedIds(){
  try{

    const obj=raw?JSON.parse(raw):{};
    const now=Date.now();
    for(const k in obj){if(now-obj[k]>86400000)delete obj[k]}

  }catch(e){return{}}

async function checkReminders(){
  if(!("Notification" in window))return;
  if(Notification.permission!=="granted")return;
  if(!orders||!orders.length)return;
  const reminded=getRemindedIds();
  for(const o of orders){
    const st=dispatcherStatus(o);
    if(st!=="need_assign")continue;
    const dt=orderDeliveryDateTime(o);
    if(!dt)continue;
    const mins=(dt.getTime()-Date.now())/60000;
    if(mins>REMINDER_LEAD_MIN||mins<REMINDER_LEAD_MIN-REMINDER_TOLERANCE_MIN)continue;
    const id=String(o.id);
    if(reminded[id])continue;
    const hotel=hotelArName(o.hotel);
    const arr=ar12(o.delivery_time)||"";
    const title="⏰ ابعت طيار — طلب #"+arNum(id);
    const body=hotel+" • وصول "+arr+" • باقي "+arNum(Math.round(mins))+" دقيقة";
    let ok=false;
    try{
      const reg=await navigator.serviceWorker.ready;
      await reg.showNotification(title,{
        body,
        icon:"icon-192.png",
        badge:"icon-192.png",

        renotify:false,

      });
      ok=true;
    }catch(e){
      try{new Notification(title,{body,icon:"icon-192.png",tag:"sc-reminder-"+id});ok=true}catch(e2){}

  }
}

// اطلب إذن الإشعارات لما المستخدم يلمس التطبيق (المتصفح بيرفض الطلب من غير user gesture)
function autoBootstrapNotifications(){
  if(!("Notification" in window)){updateNotifStatus();return}

  if(Notification.permission==="granted"){setupPush();return}
  if(Notification.permission==="denied")return;

  const askOnce=(event)=>{
    if(Notification.permission!=="default"){updateNotifStatus();return}
    try{
      const p=Notification.requestPermission();
      if(p && typeof p.then==="function"){
        p.then(perm=>{
          updateNotifStatus();
          if(perm==="granted"){
            toast("تم تفعيل الإشعارات ✓");
            setupPush();
            try{checkReminders()}catch(e){}
          }
        }).catch(()=>{updateNotifStatus()});
      }
    }catch(e){}
    document.removeEventListener("pointerdown",askOnce);
    document.removeEventListener("touchstart",askOnce);
    document.removeEventListener("click",askOnce);
  };
  document.addEventListener("pointerdown",askOnce,{passive:true});
  document.addEventListener("touchstart",askOnce,{passive:true});
  document.addEventListener("click",askOnce);
}

  const s=document.getElementById("splash");
  if(s){s.classList.add("hide");setTimeout(()=>{try{s.remove()}catch(e){}},700)}
}

// ====== PWA Install Button (simple, in header) ======
let deferredInstallPrompt=null;

function isRunningStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone===true
    || document.referrer.startsWith("android-app://");
}

window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  maybeShowInstallPrompt();
});

window.addEventListener("appinstalled",()=>{
  const btn=document.getElementById("installBtn");
  if(btn)btn.classList.remove("show");
  deferredInstallPrompt=null;
  toast("تم تنصيب التطبيق ✓");
});

function maybeShowInstallPrompt(){
  const btn=document.getElementById("installBtn");
  if(!btn)return;
  if(isRunningStandalone()){btn.classList.remove("show");return}
  btn.classList.add("show");
}

async function installApp(){
  const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(!deferredInstallPrompt){
    if(isIOS){
      toast("في Safari: اضغط زرار المشاركة ↑ واختار \"إضافة إلى الشاشة الرئيسية\"");
    }else{
      toast("من قائمة المتصفح (⋮) اختار \"تنصيب التطبيق\"");
    }
    return;
  }
  try{
    deferredInstallPrompt.prompt();
    const {outcome}=await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    const btn=document.getElementById("installBtn");
    if(btn && outcome==="accepted")btn.classList.remove("show");
    if(outcome==="accepted")toast("جاري التنصيب...");
  }catch(e){}
}

// ====== Service Worker + Auto Update ======
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      // فحص فوري عند التحميل
      reg.update().catch(()=>{});
      // فحص كل ٥ دقايق طالما التطبيق شغّال
      setInterval(()=>{reg.update().catch(()=>{})}, 5*60*1000);
      // فحص لما يفتح التاب بعد ما كان مغلق/في الخلفية
      document.addEventListener("visibilitychange",()=>{
        if(!document.hidden)reg.update().catch(()=>{});
      });
      // لو لقى تحديث جديد يستقبله ويفعّله
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if(!nw)return;
        nw.addEventListener("statechange", ()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            // فيه تحديث جاهز — نديه ثانية عشان مايقاطعش شغل جاري
            try{toast("🔄 نسخة جديدة — جاري التحديث...")}catch(e){}
            setTimeout(()=>nw.postMessage("skipWaiting"), 800);
          }
        });
      });
    }).catch(()=>{});
    // reload بلطف لما الـ SW الجديد ياخد المكان
    let refreshing=false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(refreshing)return;
      refreshing=true;
      setTimeout(()=>location.reload(), 300);
    });
  });
}

async function setupPush(){
  try{
    if(!("Notification" in window) || typeof firebase==="undefined" || !firebase.messaging) return;
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const messaging = firebase.messaging();
    const perm = await Notification.requestPermission();
    if(perm !== "granted") return;
    const reg = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token) return;
    await fetch(SB_URL+"/rest/v1/push_tokens", {
      method:"POST",
      headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({ token: token, role: "delivery" })
    });
    // لما التطبيق مفتوح، Chrome بيمنع الصوت الافتراضي — نلعبه إحنا
    messaging.onMessage((payload)=>{
      const n = (payload && payload.notification) || {};
      const d = (payload && payload.data) || {};
      const title = n.title || d.title || "🔔 إشعار";
      const body = n.body || d.body || "";
      playAlertSound();
      if(navigator.vibrate)navigator.vibrate([500,200,500,200,500]);
      toast(title + " — " + body);
      try{loadOrders()}catch(e){}
    });
  }catch(e){}
}

// صوت تنبيه من Web Audio API (٣ نبضات عالية النبرة)
let _audioCtx = null;
function playAlertSound(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(_audioCtx.state === "suspended") _audioCtx.resume();
    const ctx = _audioCtx;
    const now = ctx.currentTime;
    const beeps = [
      {freq:880, start:0.00, dur:0.22},
      {freq:1100, start:0.30, dur:0.22},
      {freq:1320, start:0.60, dur:0.30}
    ];
    for(const b of beeps){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = b.freq;
      const t0 = now + b.start;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.5, t0 + 0.02);
      gain.gain.setValueAtTime(0.5, t0 + b.dur - 0.05);
      gain.gain.linearRampToValueAtTime(0, t0 + b.dur);
      osc.start(t0);
      osc.stop(t0 + b.dur + 0.05);
    }
  }catch(e){}
}
